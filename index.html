<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Words Speaker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-div">
        <div class="header-div">
            <label class="header">Random Words Speaker</label>
        </div>
        <div class="theme-toggle-div">
            <button id="mode-change-button" class="secondary-buttons-class"></button>
        </div>

        <div class="current-word-class" id="current-word-div">Hello!</div>
        
        <div class="btn-container">
            <button id="previous-button" class="scroll-buttons"><<</button>
            <button id="play-button">Play</button>
            <button id="reset-button">Reset</button>
            <button id="next-button" class="scroll-buttons">>></button>
        </div>

        <div class="container">
            <div class="box">
                <div>
                    <label for="speed-drop-down">Speed:</label>
                    <select id="speed-drop-down" class="drop-down-class">
                    </select>

                    <input type="number" id="custom-speed-input" placeholder="Enter in WPM" min="10" max="40" class="drop-down-class custom-speed-input-class" style="display: none;">
                    <button id="custom-speed-button" style="display: none;" class="box-btn">Submit</button>
                </div>
                <div>
                    <label for="speaker-toggle-radio">Speak ?</label>
                    <input type="checkbox" name="speaker-toggle-radio" id="speaker-toggle-radio" checked class="speak-toggle-class">

                    <label for="voice-drop-down" class="voice-label">Voice:</label>
                    <select id="voice-drop-down" class="drop-down-class"></select>
                </div>

                <div style="margin-bottom: 0;">
                    <label for="random-words-toggle">Random Words</label>
                    <input type="radio" name="mode-selector" id="random-words-toggle" value="random" checked>
                    <label for="custom-text-toggle">Custom Text</label>
                    <input type="radio" name="mode-selector" id="custom-text-toggle" value="custom">
                </div>

                <div style="display: none;" id="custom-text-div">
                    <div class="randomise-custom-text-div-class">
                        <label for="randomise-toggle-radio">Randomise ?</label>
                        <input type="checkbox" name="randomise-toggle-radio" id="randomise-toggle-radio" class="speak-toggle-class">
                        <button id="submit-custom-text-button" class="submit-custom-text-button-class">Submit the text</button>
                    </div>
                    <textarea id="custom-text-field" class="textarea-class" placeholder="Enter your custom text here and click submit button above ....."></textarea>
                </div>
            </div>

            <div class = "box">
                <div style="display: none;" id="custom-text-progress-div">
                    <span>Progress of Custom Text:</span>
                    <span id="custom-text-progress-span">0</span>
                </div>
                <div>
                    <span>Average Speed (WPM):</span>
                    <span id="avg-wpm-span">0</span>
                </div>
                <div>
                    <span>Average Speed (LPM):</span>
                    <span id="avg-lpm-span">0</span>
                </div>
                <div>
                    <span>Instantaneous Speed (LPM):</span>
                    <span id="inst-lpm-span">0</span>
                </div>
                <div>
                    <span>Total words generated:</span>
                    <span id="no-of-words-span">0</span>
                </div>
                <div>
                    <span>No of letters generated:</span>
                    <span id="no-of-letters-span">0</span>
                </div>
                <div>
                    <span>Time elapsed:</span>
                    <span id="time-elapsed-span">0s</span>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
